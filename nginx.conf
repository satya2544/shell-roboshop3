server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;

    include /etc/nginx/default.d/*.conf;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /images/ {
        expires 5s;
        root /usr/share/nginx/html;
        try_files $uri /images/placeholder.jpg;
    }

    location /api/catalogue/ {
        proxy_pass http://catalogue.daws85s.online:8080/;
    }

    location /api/user/ {
        proxy_pass http://user.daws85s.online:8080/;
    }

    location /api/cart/ {
        proxy_pass http://cart.daws85s.online:8080/;
    }

    location /api/shipping/ {
        proxy_pass http://shipping.daws85s.online:8080/;
    }

    location /api/payment/ {
        proxy_pass http://payment.daws85s.online:8080/;
    }

    location /health {
        stub_status on;
        access_log off;
    }
}